<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="lezione01.css" />

    <title>Lezione 01 - Salvare i dati nel browser</title>
  </head>

  <body>
    <main class="container">
      <form class="form">
        <div class="form__header">
          <h1 class="form__title">Create Account</h1>

          <p class="form__subtitle">Fill in your information to continue</p>
        </div>

        <div class="form__group">
          <label for="name" class="form__label">Name</label>

          <input type="text" id="name" class="form__input" placeholder="Nome" />
        </div>

        <div class="form__group">
          <label for="surname" class="form__label">Surname</label>

          <input
            type="text"
            id="surname"
            class="form__input"
            placeholder="Surname"
          />
        </div>

        <div class="form__group">
          <label for="email" class="form__label">Email</label>

          <input
            type="email"
            id="email"
            class="form__input"
            placeholder="example@domain.com"
          />
        </div>

        <div class="form__group">
          <label for="password" class="form__label">Password</label>

          <input
            type="password"
            id="password"
            class="form__input"
            placeholder="********"
          />
        </div>

        <button type="submit" class="form__button">Sign Up</button>

        <div class="account-result">
          <h2 class="account-result__title">Account created</h2>

          <p>
            Nome completo:
            <strong class="account-result__full-name"></strong>
          </p>

          <p>
            Email:
            <strong class="account-result__email"></strong>
          </p>

          <p>
            Password:
            <strong class="account-result__password"></strong>
          </p>
        </div>
      </form>
    </main>

    <script type="module" src="lezione01.js"></script>
  </body>
</html>
